# =============================================
#  Decap CMS Configuration
#  Your friend edits content at /admin
# =============================================

backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/RainSite  # ← Replace with actual repo
  branch: main
  # Optional: use the Netlify OAuth proxy, or GitHub OAuth app
  # See: https://decapcms.org/docs/github-backend/

# Where uploaded images go
media_folder: "public/images"
public_folder: "/images"

# Use editorial workflow for draft → review → publish
publish_mode: editorial_workflow

# Slug formatting
slug:
  encoding: "ascii"
  clean_accents: true

# ─── Collections ───────────────────────────

collections:

  # ── Prints ──
  - name: "prints"
    label: "Prints"
    label_singular: "Print"
    folder: "src/content/prints"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { name: "title",     label: "Title",      widget: "string" }
      - { name: "image",     label: "Image",      widget: "image" }
      - { name: "price",     label: "Price ($)",   widget: "number", value_type: "int", min: 1 }
      - { name: "salePrice", label: "Sale Price ($)", widget: "number", value_type: "int", required: false, hint: "Leave blank for no sale. Set a price here to show a sale." }
      - { name: "saleEnds",  label: "Sale Ends",  widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Date the sale automatically ends. Leave blank for no expiration." }
      - { name: "medium",    label: "Medium",     widget: "string", default: "Digital Print on Matte Paper" }
      - { name: "size",      label: "Size",       widget: "string", hint: 'e.g. 8×10" or 11×14"' }
      - { name: "buyLink",   label: "Buy Link (Stripe)", widget: "string", required: false, hint: "Paste a Stripe Payment Link URL here" }
      - { name: "featured",  label: "Featured on Homepage", widget: "boolean", default: false }
      - { name: "sortOrder", label: "Sort Order",  widget: "number", value_type: "int", default: 0, hint: "Lower numbers appear first" }
      - { name: "published", label: "Published",   widget: "boolean", default: true }
      - { name: "body",      label: "Description (optional)", widget: "markdown", required: false }

  # ── Originals ──
  - name: "originals"
    label: "Originals"
    label_singular: "Original"
    folder: "src/content/originals"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { name: "title",       label: "Title",       widget: "string" }
      - { name: "image",       label: "Image",       widget: "image" }
      - { name: "price",       label: "Price ($)",    widget: "number", value_type: "int", required: false, hint: "Leave blank if not for sale" }
      - { name: "salePrice",   label: "Sale Price ($)", widget: "number", value_type: "int", required: false }
      - { name: "saleEnds",    label: "Sale Ends",   widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: "medium",      label: "Medium",      widget: "string", hint: "e.g. Oil on Canvas" }
      - { name: "size",        label: "Size",        widget: "string" }
      - { name: "sold",        label: "Sold",        widget: "boolean", default: false }
      - { name: "inquireEmail", label: "Inquiry Email", widget: "string", default: "hello@darkbloomstudio.com" }
      - { name: "featured",    label: "Featured on Homepage", widget: "boolean", default: false }
      - { name: "sortOrder",   label: "Sort Order",   widget: "number", value_type: "int", default: 0 }
      - { name: "published",   label: "Published",    widget: "boolean", default: true }
      - { name: "body",        label: "Description (optional)", widget: "markdown", required: false }

  # ── Events ──
  - name: "events"
    label: "Events"
    label_singular: "Event"
    folder: "src/content/events"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { name: "title",       label: "Event Name",    widget: "string" }
      - { name: "date",        label: "Display Date",  widget: "string", hint: 'How the date appears on the site, e.g. "March 15, 2026" or "April 24–26, 2026"' }
      - { name: "sortDate",    label: "Sort Date",     widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, hint: "Used to sort events and determine upcoming vs past" }
      - { name: "location",    label: "Location",      widget: "string" }
      - { name: "description", label: "Description",   widget: "text", required: false }
      - { name: "link",        label: "Event Link",    widget: "string", required: false }
      - { name: "image",       label: "Event Image",   widget: "image", required: false }
      - { name: "published",   label: "Published",     widget: "boolean", default: true }
      - { name: "body",        label: "Extra Details (optional)", widget: "markdown", required: false }
